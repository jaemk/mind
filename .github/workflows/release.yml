name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Pinned by rust-toolchain.toml; named here too so the action installs
      # exactly the toolchain cargo will then select. Keep the two in step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make ci

  ci-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Pinned by rust-toolchain.toml; named here too so the action installs
      # exactly the toolchain cargo will then select. Keep the two in step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make ci

  build:
    name: build ${{ matrix.target }}
    needs: [ci, ci-macos]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # The release binaries are built with a deliberately pinned toolchain, not
    # the dev one. rust-toolchain.toml would otherwise win over the `toolchain:`
    # input below and silently build the release on a different compiler than
    # the pin names; RUSTUP_TOOLCHAIN outranks the file, so the pin holds.
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          # musl legs: statically linked, glibc-version-independent binaries
          # for install.sh's direct download (B6). The gnu legs above are kept
          # for the Homebrew formula (resources/update-formula.sh).
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "tag v${tag_version} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "version OK: ${tag_version}"
      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: configure musl linker (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: configure musl linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Embed a dependency SBOM in the shipped binary (cargo-auditable) so
      # `cargo audit bin mind` can scan a downloaded release against the RustSec
      # advisory database. Pinned for a reproducible release build.
      - name: install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.5 --locked
      - name: build
        run: cargo auditable build --release --locked --bin mind --target ${{ matrix.target }}
      - name: package
        run: |
          cargo package --locked --target ${{ matrix.target }}
          version="${GITHUB_REF_NAME#v}"
          dist="mind-${version}-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/mind" "$dist/"
          tar -czf "${dist}.tar.gz" -C "$dist" mind
      - name: attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: mind-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: mind-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > ../SHA256SUMS
          cd ..
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash resources/changelog-section.sh "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md

  publish:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    # Same reason as the build job: keep the deliberate publish pin from being
    # overridden by rust-toolchain.toml, which outranks the `toolchain:` input.
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Default checkout is github.ref (the tag). cargo publish --locked must
        # run from the exact tagged commit, not from main.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, pinned commit (moving branch ref; runs alongside id-token: write)
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: commit formula
        # NOTE: this pushes straight to main with the job's default GITHUB_TOKEN.
        # If branch protection is ever enabled on main (required reviews, required
        # status checks, or a restriction on who can push), this push starts
        # failing and the formula silently stops updating on release; either add
        # `contents: write` to an allowed bypass actor for github-actions[bot], or
        # switch this step to open a PR instead of pushing directly.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          bash resources/update-formula.sh "${GITHUB_REF_NAME#v}" dist Formula/mind.rb
          git add Formula/mind.rb
          if git diff --cached --quiet; then
            echo "formula already up to date"
          else
            git commit -m "release: update mind formula to ${GITHUB_REF_NAME#v}"
            git push origin main
          fi
