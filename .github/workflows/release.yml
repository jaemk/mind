name: release

# Merging a version bump to main is the release. Every push to main runs
# `decide`, which releases only when Cargo.toml carries a stable version that
# has no GitHub release yet: a `-dev` version (main between releases) and an
# already-released version both skip, so ordinary merges cost one short job.
# The workflow creates the `v<version>` tag itself, through `gh release create`.
#
# `workflow_dispatch` re-runs a release that failed partway. Every publishing
# step below is idempotent: an existing GitHub release gets its assets
# re-uploaded, a version already on crates.io is not published again, and an
# up-to-date formula is not re-committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    # A fork has no `release` environment and no publish credentials.
    if: github.repository == 'jaemk/mind'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: decide whether this commit is a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "could not read the version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*)
              echo "$version is a pre-release (main between releases); nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # A lookup failure other than "not found" must fail loudly rather
          # than skip a real release.
          if gh release view "v$version" --json tagName >/dev/null 2>err.txt; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "v$version exists; re-running its release steps"
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "v$version is already released; nothing to release"
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q "release not found" err.txt; then
            echo "v$version has no release yet; releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            cat err.txt >&2
            exit 1
          fi

  ci:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned by rust-toolchain.toml; named here too so the action installs
      # exactly the toolchain cargo will then select. Keep the two in step.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, pinned commit
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: make ci

  ci-macos:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned by rust-toolchain.toml; named here too so the action installs
      # exactly the toolchain cargo will then select. Keep the two in step.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, pinned commit
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: make ci

  # A release must not ship a tree with a known advisory. ci.yml's audit job
  # runs beside this workflow but does not gate it, and the `make ci` above
  # always takes the audit target's skip branch, because the runner images do
  # not ship cargo-audit. This is the one place the scan actually gates the
  # artifacts.
  audit:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build ${{ matrix.target }}
    needs: [decide, ci, ci-macos, audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # The release binaries are built with a deliberately pinned toolchain, not
    # the dev one. rust-toolchain.toml would otherwise win over the `toolchain:`
    # input below and silently build the release on a different compiler than
    # the pin names; RUSTUP_TOOLCHAIN outranks the file, so the pin holds.
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
      VERSION: ${{ needs.decide.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Intel macOS, cross-compiled on the Apple Silicon runner: the Xcode
          # toolchain builds both architectures, so this leg does not depend
          # on an Intel runner image.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          # musl legs: statically linked, glibc-version-independent binaries
          # for install.sh's direct download (B6). The gnu legs above are kept
          # for the Homebrew formula (resources/update-formula.sh).
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: configure musl linker (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: configure musl linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, pinned commit
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      # Embed a dependency SBOM in the shipped binary (cargo-auditable) so
      # `cargo audit bin mind` can scan a downloaded release against the RustSec
      # advisory database. Pinned for a reproducible release build.
      - name: install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.5 --locked
      - name: build
        run: cargo auditable build --release --locked --bin mind --target ${{ matrix.target }}
      - name: package
        run: |
          cargo package --locked --target ${{ matrix.target }}
          dist="mind-${VERSION}-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/mind" "$dist/"
          tar -czf "${dist}.tar.gz" -C "$dist" mind
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mind-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: mind-*.tar.gz

  release:
    needs: [decide, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > ../SHA256SUMS
          cd ..
      - name: create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        # `--target` creates the `v<version>` tag on the released commit. The
        # "Protected release" tag ruleset must list GitHub Actions as a bypass
        # actor, or this tag creation is refused.
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "$tag exists; re-uploading its assets"
            gh release upload "$tag" dist/*.tar.gz SHA256SUMS --clobber
          else
            bash resources/changelog-section.sh "$VERSION" > notes.md
            gh release create "$tag" dist/*.tar.gz SHA256SUMS --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi

  publish:
    needs: [decide, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    # Same reason as the build job: keep the deliberate publish pin from being
    # overridden by rust-toolchain.toml, which outranks the `toolchain:` input.
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
      VERSION: ${{ needs.decide.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Default checkout is the released commit. cargo publish --locked must
        # run from it, not from a newer main.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, pinned commit (moving branch ref; runs alongside id-token: write)
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: check whether the version is already on crates.io
        id: crate
        run: |
          set -euo pipefail
          # A lookup failure must fail loudly rather than skip the publish.
          body="$(curl -sS --fail-with-body \
            -H "User-Agent: jaemk-mind-release-workflow" \
            "https://crates.io/api/v1/crates/mind-cli/versions")"
          if jq -e --arg v "$VERSION" '.versions[] | select(.num == $v)' >/dev/null <<<"$body"; then
            echo "mind-cli $VERSION is already on crates.io"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.crate.outputs.published == 'false'
        id: auth
      - name: publish to crates.io
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # --no-verify: a verification build here would compile every build
        # script and proc macro in the tree while CARGO_REGISTRY_TOKEN is in
        # this step's environment, so any one of them could read it. The build
        # job already ran `cargo package --locked` per target, which verifies,
        # so this would be a second build buying nothing but that exposure.
        run: cargo publish --locked --no-verify
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: commit the formula and the next dev version
        # Pushes straight to main with the job's default GITHUB_TOKEN. If branch
        # protection is ever enabled on main (required reviews, required status
        # checks, or a restriction on who can push), this push starts failing;
        # either add github-actions[bot] as an allowed bypass actor, or switch
        # this step to open a PR instead of pushing directly.
        #
        # The same commit puts main back on the next patch's `-dev` version, so
        # a build from main never reports the released version. It is skipped
        # when main has already moved off the released version. A push made
        # with GITHUB_TOKEN starts no workflow run, so it does not re-enter
        # this one (and `decide` would skip the `-dev` version if it did).
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          bash resources/update-formula.sh "$VERSION" dist Formula/mind.rb
          git add Formula/mind.rb
          message="release: update mind formula to ${VERSION}"
          if grep -q "^version = \"${VERSION}\"$" Cargo.toml; then
            IFS=. read -r major minor patch <<<"$VERSION"
            next="${major}.${minor}.$((patch + 1))-dev"
            sed -i "0,/^version = \"${VERSION}\"$/s//version = \"${next}\"/" Cargo.toml
            cargo update --workspace
            git add Cargo.toml Cargo.lock
            message="${message}, back to ${next}"
          fi
          if git diff --cached --quiet; then
            echo "formula and version already up to date"
          else
            git commit -m "$message"
            git push origin main
          fi
