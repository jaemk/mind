name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Pinned by rust-toolchain.toml; named here too so the action installs
      # exactly the toolchain cargo will then select. Keep the two in step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # `make ci` = fmt-check + clippy (-D warnings) + tests, including the
      # spec-coverage gate (tests/spec_coverage.rs), which fails if a spec ID is
      # neither cited by a test nor allowlisted. (`make check` is the local gate:
      # same lints and tests, but formats in place instead of just checking.)
      - run: make ci

  check-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Pinned by rust-toolchain.toml; named here too so the action installs
      # exactly the toolchain cargo will then select. Keep the two in step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make ci

  # Compiles against the minimum supported Rust version declared in
  # Cargo.toml's `rust-version`, so a change that needs a newer compiler
  # feature is caught here instead of by a user on an older toolchain.
  # Keep the pinned toolchain below in step with Cargo.toml `rust-version`.
  #
  # RUSTUP_TOOLCHAIN is what makes this gate real: rust-toolchain.toml pins the
  # dev/CI toolchain repo-wide and would otherwise win here, so `cargo check`
  # would run on that toolchain and the MSRV check would silently pass without
  # ever compiling against the minimum. The env var outranks the file.
  #
  # NOTE: the declared floor currently EQUALS the dev pin (both 1.98), so this
  # job compiles with the same toolchain as `check` and gates nothing today. It
  # is kept because it becomes load-bearing again the moment rust-toolchain.toml
  # moves ahead of `rust-version`, which is exactly when an accidental MSRV
  # creep would otherwise ship unnoticed.
  #
  # `--locked` matters: it verifies the committed Cargo.lock, which is the one
  # `cargo publish --locked` ships and the one docs/src/install.md tells users
  # to install with. Without it this job would re-resolve and could pass on a
  # dependency set no consumer receives.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.98"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  # Advisory database scan of the dependency tree (RustSec). Informational on
  # the check-run it creates; does not fail the job for a forked PR that
  # cannot write checks (GITHUB_TOKEN is read-only there).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      # Pinned past v2.0.0 to the commit that moved the action to node24;
      # v2.0.0 still runs on the deprecated node20. Repin to a tag once one ships.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
